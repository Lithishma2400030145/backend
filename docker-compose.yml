services:
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3311:3306"]
    volumes: ["auth-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-job:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: job_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3307:3306"]
    volumes: ["job-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-application:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: application_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3308:3306"]
    volumes: ["application-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-recruitment:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: recruitment_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3309:3306"]
    volumes: ["recruitment-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-profile:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: profile_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports: ["3310:3306"]
    volumes: ["profile-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    ports: ["8761:8761"]

  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    environment:
      DB_HOST: mysql-auth
      DB_NAME: auth_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-auth: {condition: service_healthy}
      eureka-server: {condition: service_started}

  job-service:
    build: ./job-service
    ports: ["8082:8082"]
    environment:
      DB_HOST: mysql-job
      DB_NAME: job_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-job: {condition: service_healthy}
      eureka-server: {condition: service_started}

  application-service:
    build: ./application-service
    ports: ["8083:8083"]
    environment:
      DB_HOST: mysql-application
      DB_NAME: application_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-application: {condition: service_healthy}
      eureka-server: {condition: service_started}

  recruitment-service:
    build: ./recruitment-service
    ports: ["8084:8084"]
    environment:
      DB_HOST: mysql-recruitment
      DB_NAME: recruitment_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-recruitment: {condition: service_healthy}
      eureka-server: {condition: service_started}

  profile-service:
    build: ./profile-service
    ports: ["8085:8085"]
    environment:
      DB_HOST: mysql-profile
      DB_NAME: profile_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-profile: {condition: service_healthy}
      eureka-server: {condition: service_started}

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    depends_on:
      eureka-server: {condition: service_started}
      auth-service: {condition: service_started}
      job-service: {condition: service_started}
      application-service: {condition: service_started}
      recruitment-service: {condition: service_started}
      profile-service: {condition: service_started}

volumes:
  auth-db:
  job-db:
  application-db:
  recruitment-db:
  profile-db:
