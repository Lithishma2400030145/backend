spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # Job Service Routes
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**

        # Application Service Routes
        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/applications/**

        # Recruitment Service Routes
        - id: recruitment-service
          uri: lb://recruitment-service
          predicates:
            - Path=/api/recruitment/**

        # Profile Service Routes
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            exposedHeaders: Authorization
            allowCredentials: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always