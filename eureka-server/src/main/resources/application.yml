spring:
  application:
    name: eureka-server

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8761}
  address: 0.0.0.0
  servlet:
    context-path: /

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false

  server:
    register-with-eureka: false
    fetch-registry: false
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85
    disable-delta: false

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,env

  endpoint:
    health:
      show-details: always

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

app:
  name: TalentSync Eureka Server
  version: 1.0.0
  description: Service Registry and Discovery for TalentSync Microservices

info:
  app:
    name: ${app.name}
    version: ${app.version}
    description: ${app.description}
  company: TalentSync Inc.
  environment: development